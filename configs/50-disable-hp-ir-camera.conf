# Disable HP-IR-Camera (Howdy facial auth loopback device) from WirePlumber / desktop apps
# This prevents GNOME Snapshot, Cheese, and web browsers from opening the IR loopback,
# which would lock the shared IPU3 CIO2 DMA receiver and block the front/back RGB webcams.

monitor.v4l2.rules = [
  {
    matches = [
      {
        device.description = "HP-IR-Camera"
      }
      {
        device.name = "~.*video20.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
